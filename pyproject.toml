[project]
name = "grocery-sales-forecast"
version = "0.1.0"
description = "Corporación Favorita grocery sales forecasting research and dashboard"
readme = "README.md"
requires-python = ">=3.14.4,<3.15"
dependencies = [
    "numpy==2.5.2",
    "pandas==3.0.5",
    "python-dateutil==2.9.0.post0",
    "tzdata==2026.6",
]

[dependency-groups]
app = ["streamlit==1.67.0"]
models = [
    "joblib==1.5.3",
    "lightgbm==4.7.0",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "threadpoolctl==3.6.0",
    "xgboost==3.4.0",
]
notebooks = [
    { include-group = "models" },
    "ipykernel==7.3.0",
    "jupyter==1.1.1",
    "matplotlib==3.11.1",
]

[tool.uv]
package = false
default-groups = ["app", "models"]
